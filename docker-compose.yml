services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cheatsheet
      POSTGRES_PASSWORD: cheatsheet
      POSTGRES_DB: cheatsheet
    ports:
      - '5432:5432'
    volumes:
      - cheatsheet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cheatsheet -d cheatsheet']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cheatsheet_pgdata:
