name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cheatsheet
          POSTGRES_PASSWORD: cheatsheet
          POSTGRES_DB: cheatsheet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cheatsheet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SESSION_SECRET: ci-secret-thats-long-enough-32bytes
      WORKER_SHARED_SECRET: ci-secret-thats-long-enough-32bytes
      DATABASE_URL: postgresql://cheatsheet:cheatsheet@localhost:5432/cheatsheet
      APP_URL: http://app.test
      WORKER_URL: http://localhost:4000
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      SKIP_PDF_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cheatsheet
          POSTGRES_PASSWORD: cheatsheet
          POSTGRES_DB: cheatsheet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cheatsheet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SESSION_SECRET: ci-secret-thats-long-enough-32bytes
      WORKER_SHARED_SECRET: ci-secret-thats-long-enough-32bytes
      DATABASE_URL: postgresql://cheatsheet:cheatsheet@localhost:5432/cheatsheet
      APP_URL: http://localhost:3000
      WORKER_URL: http://localhost:4000
      # Worker uses Puppeteer; install Chromium during the install step.
      PUPPETEER_SKIP_DOWNLOAD: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Build web + worker
        run: pnpm --filter @cheatsheet/web build && pnpm --filter @cheatsheet/worker build
      - name: Install Playwright browsers
        run: pnpm --filter @cheatsheet/web exec playwright install --with-deps chromium
      - name: Start worker (background)
        run: pnpm --filter @cheatsheet/worker start &
      - name: Start web (background)
        run: pnpm --filter @cheatsheet/web start &
      - name: Wait for services
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/healthz >/dev/null && \
              curl -sf http://localhost:4000/healthz >/dev/null && exit 0
            sleep 2
          done
          echo "services failed to come up" && exit 1
      - name: Run Playwright
        run: pnpm --filter @cheatsheet/web test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
